---
# vainu-cli CI/CD Pipeline
# Stages run in order; each must pass before the next begins.
#
# Required GitLab CI variables (Settings → CI/CD → Variables):
#   PYPI_API_TOKEN   Masked + Protected  PyPI API token (pypi-...) scoped to vainu-cli

stages:
  - lint
  - security
  - test
  - build
  - publish

variables:
  UV_VERSION: "0.5"
  PIP_NO_CACHE_DIR: "1"
  # Expose uv cache across jobs on the same runner
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

# ── Reusable anchors ─────────────────────────────────────────────────────────

.uv_setup: &uv_setup
  before_script:
    - pip install "uv==${UV_VERSION}" --quiet
    - uv sync --extra dev

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .uv-cache/

# ── Lint ─────────────────────────────────────────────────────────────────────

ruff-check:
  stage: lint
  image: python:3.12-slim
  <<: *uv_setup
  script:
    - uv run ruff check src/ tests/
    - uv run ruff format --check src/ tests/
  allow_failure: false

# ── Security ─────────────────────────────────────────────────────────────────

bandit:
  stage: security
  image: python:3.12-slim
  <<: *uv_setup
  script:
    - uv run bandit -c pyproject.toml -r src/
  allow_failure: false

pip-audit:
  stage: security
  image: python:3.12-slim
  <<: *uv_setup
  script:
    - uv run pip-audit
  allow_failure: false

# ── Test matrix ───────────────────────────────────────────────────────────────

pytest:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  <<: *uv_setup
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.11"
          - "3.12"
          - "3.13"
  script:
    - uv run pytest
        --tb=short
        -q
        --junitxml=junit-${PYTHON_VERSION}.xml
        --cov=vainu_cli
        --cov-report=term-missing
        --cov-report=xml:coverage-${PYTHON_VERSION}.xml
  coverage: '/(?i)total.*?\s+(\d{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: junit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-*.xml
    expire_in: 1 week

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: python:3.12-slim
  before_script:
    - pip install "uv==${UV_VERSION}" --quiet
  script:
    - uv build
    - uv run python -c "import vainu_cli; print(vainu_cli.__version__)"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    # Build on version tags (v1.2.3) and on merge requests for sanity-check
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── Publish ───────────────────────────────────────────────────────────────────

publish-pypi:
  stage: publish
  image: python:3.12-slim
  dependencies:
    - build
  before_script:
    - pip install "uv==${UV_VERSION}" --quiet
  script:
    - uv publish --token "$PYPI_API_TOKEN"
  rules:
    # Only publish when a version tag is pushed and the build passed
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
      when: on_success
  environment:
    name: pypi
    url: https://pypi.org/project/vainu-cli/
