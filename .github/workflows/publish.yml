name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  publish:
    name: Build & publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vainu-cli/
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v5

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(uv run python -c "import vainu_cli; print(vainu_cli.__version__)")
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"  # strip leading 'v'
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
