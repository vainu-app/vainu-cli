name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [bandit, pip-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Run bandit
        if: matrix.tool == 'bandit'
        run: uv run bandit -c pyproject.toml -r src/
      - name: Run pip-audit
        if: matrix.tool == 'pip-audit'
        run: uv run pip-audit

  # ── Test matrix ───────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: |
          uv run pytest \
            --tb=short \
            -q \
            --junitxml=junit-${{ matrix.python-version }}.xml \
            --cov=vainu_cli \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage-*.xml

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run python -c "import vainu_cli; print(vainu_cli.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

