[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vainu-cli"
dynamic = ["version"]
description = "CLI and Python client for the Vainu company data API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vainu", email = "dev@vainu.io" }]
keywords = ["vainu", "company-data", "api-client", "cli", "nordic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "responses>=0.25",
    "ruff>=0.4",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]

[project.scripts]
vainu = "vainu_cli.cli:main"

[project.urls]
Homepage = "https://vainu.com"
Repository = "https://gitlab.com/vainu/vainu-cli"
Changelog = "https://gitlab.com/vainu/vainu-cli/-/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/vainu_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vainu_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",   # allow assert in tests
    "S603",   # subprocess calls are intentional (curl download)
    "S607",   # partial path for subprocess — curl is expected on PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B603", "B607"]

[tool.coverage.run]
source = ["src/vainu_cli"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
